name: Go

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      - name: Show Go version
        run: go version

      - name: Run tests
        run: go test -mod=vendor ./...

      - name: Run vet
        run: go vet -mod=vendor ./...

      - name: Build CLI
        run: go build -mod=vendor -o gogator ./cmd/gogator

      - name: Run smoke tests
        run: bash scripts/smoke.sh
